services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: crewlog
      POSTGRES_PASSWORD: crewlog
      POSTGRES_DB: crewlog
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U crewlog -d crewlog"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
